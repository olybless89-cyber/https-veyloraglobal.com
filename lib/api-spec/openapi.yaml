openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Veylora Global API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tracking
    description: Public shipment tracking
  - name: couriers
    description: Courier/shipment management (admin)
  - name: track-updates
    description: Tracking status updates (admin)
  - name: officers
    description: Officer management (admin)
  - name: offices
    description: Office management (admin)
  - name: auth
    description: Authentication
  - name: contact
    description: Contact form
  - name: dashboard
    description: Admin dashboard stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get current session
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"

  # ─── Public Tracking ─────────────────────────────────────────────────────
  /track:
    post:
      operationId: trackShipment
      tags: [tracking]
      summary: Track a shipment by consignment number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackInput"
      responses:
        "200":
          description: Tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  # ─── Contact ─────────────────────────────────────────────────────────────
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # ─── Dashboard ───────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Couriers (Admin) ────────────────────────────────────────────────────
  /couriers:
    get:
      operationId: listCouriers
      tags: [couriers]
      summary: List all shipments
      responses:
        "200":
          description: List of couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Courier"
    post:
      operationId: createCourier
      tags: [couriers]
      summary: Create a new shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierInput"
      responses:
        "201":
          description: Courier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"

  /couriers/{id}:
    get:
      operationId: getCourier
      tags: [couriers]
      summary: Get a shipment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Courier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    put:
      operationId: updateCourier
      tags: [couriers]
      summary: Update a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"
    delete:
      operationId: deleteCourier
      tags: [couriers]
      summary: Delete a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # ─── Tracking Updates (Admin) ────────────────────────────────────────────
  /couriers/{consNo}/track-updates:
    get:
      operationId: listTrackUpdates
      tags: [track-updates]
      summary: List tracking history for a shipment
      parameters:
        - name: consNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tracking updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackUpdate"
    post:
      operationId: addTrackUpdate
      tags: [track-updates]
      summary: Add a tracking status update
      parameters:
        - name: consNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackUpdateInput"
      responses:
        "201":
          description: Tracking update added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackUpdate"

  /track-updates/{id}:
    delete:
      operationId: deleteTrackUpdate
      tags: [track-updates]
      summary: Delete a tracking update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # ─── Officers (Admin) ────────────────────────────────────────────────────
  /officers:
    get:
      operationId: listOfficers
      tags: [officers]
      summary: List all officers
      responses:
        "200":
          description: List of officers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Officer"
    post:
      operationId: createOfficer
      tags: [officers]
      summary: Create a new officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficerInput"
      responses:
        "201":
          description: Officer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"

  /officers/{id}:
    delete:
      operationId: deleteOfficer
      tags: [officers]
      summary: Delete an officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # ─── Offices (Admin) ─────────────────────────────────────────────────────
  /offices:
    get:
      operationId: listOffices
      tags: [offices]
      summary: List all offices
      responses:
        "200":
          description: List of offices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Office"
    post:
      operationId: createOffice
      tags: [offices]
      summary: Create a new office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeInput"
      responses:
        "201":
          description: Office created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Office"

  /offices/{id}:
    delete:
      operationId: deleteOffice
      tags: [offices]
      summary: Delete an office
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResult:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResult:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ─── Auth ───────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [success, username, role]
      properties:
        success:
          type: boolean
        username:
          type: string
        role:
          type: string

    SessionResult:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]
        role:
          type: ["string", "null"]

    # ─── Tracking ────────────────────────────────────────────────────────────
    TrackInput:
      type: object
      required: [consNo]
      properties:
        consNo:
          type: string
          minLength: 5

    TrackingResult:
      type: object
      required: [courier, updates]
      properties:
        courier:
          $ref: "#/components/schemas/Courier"
        updates:
          type: array
          items:
            $ref: "#/components/schemas/TrackUpdate"

    # ─── Contact ─────────────────────────────────────────────────────────────
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string

    # ─── Dashboard ────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalShipments, inTransit, delivered, totalOfficers, totalOffices, recentShipments]
      properties:
        totalShipments:
          type: integer
        inTransit:
          type: integer
        delivered:
          type: integer
        totalOfficers:
          type: integer
        totalOffices:
          type: integer
        recentShipments:
          type: array
          items:
            $ref: "#/components/schemas/Courier"

    # ─── Courier ─────────────────────────────────────────────────────────────
    Courier:
      type: object
      required:
        - id
        - consNo
        - sName
        - sMail
        - sPhone
        - sAdd
        - rName
        - rMail
        - rPhone
        - rAdd
        - type
        - weight
        - invoiceNo
        - qty
        - freight
        - mode
        - pmode
        - pickDate
        - deptDate
        - status
        - product
        - origin
        - destination
      properties:
        id:
          type: integer
        consNo:
          type: string
        sName:
          type: string
        sMail:
          type: string
        sPhone:
          type: string
        sAdd:
          type: string
        rName:
          type: string
        rMail:
          type: string
        rPhone:
          type: string
        rAdd:
          type: string
        type:
          type: string
        weight:
          type: string
        invoiceNo:
          type: string
        qty:
          type: integer
        freight:
          type: string
        mode:
          type: string
        pmode:
          type: string
        pickDate:
          type: string
        deptDate:
          type: string
        status:
          type: string
        product:
          type: string
        origin:
          type: string
        destination:
          type: string
        lat:
          type: ["string", "null"]
        lon:
          type: ["string", "null"]

    CourierInput:
      type: object
      required:
        - consNo
        - sName
        - sMail
        - sPhone
        - sAdd
        - rName
        - rMail
        - rPhone
        - rAdd
        - type
        - weight
        - invoiceNo
        - qty
        - freight
        - mode
        - pmode
        - pickDate
        - deptDate
        - status
        - product
        - origin
        - destination
      properties:
        consNo:
          type: string
        sName:
          type: string
        sMail:
          type: string
        sPhone:
          type: string
        sAdd:
          type: string
        rName:
          type: string
        rMail:
          type: string
        rPhone:
          type: string
        rAdd:
          type: string
        type:
          type: string
        weight:
          type: string
        invoiceNo:
          type: string
        qty:
          type: integer
        freight:
          type: string
        mode:
          type: string
        pmode:
          type: string
        pickDate:
          type: string
        deptDate:
          type: string
        status:
          type: string
        product:
          type: string
        origin:
          type: string
        destination:
          type: string
        lat:
          type: string
        lon:
          type: string

    CourierUpdate:
      type: object
      properties:
        sName:
          type: string
        sMail:
          type: string
        sPhone:
          type: string
        sAdd:
          type: string
        rName:
          type: string
        rMail:
          type: string
        rPhone:
          type: string
        rAdd:
          type: string
        type:
          type: string
        weight:
          type: string
        qty:
          type: integer
        freight:
          type: string
        mode:
          type: string
        pmode:
          type: string
        pickDate:
          type: string
        deptDate:
          type: string
        status:
          type: string
        product:
          type: string
        origin:
          type: string
        destination:
          type: string
        lat:
          type: string
        lon:
          type: string

    # ─── Track Update ────────────────────────────────────────────────────────
    TrackUpdate:
      type: object
      required:
        - id
        - cid
        - consNo
        - updateDate
        - currentCity
        - newStatus
        - comments
        - currentLocation
        - bkTime
      properties:
        id:
          type: integer
        cid:
          type: integer
        consNo:
          type: string
        updateDate:
          type: string
        currentCity:
          type: string
        newStatus:
          type: string
        comments:
          type: string
        currentLocation:
          type: string
        bkTime:
          type: string
        rName:
          type: ["string", "null"]
        rPhone:
          type: ["string", "null"]
        rMail:
          type: ["string", "null"]
        rAdd:
          type: ["string", "null"]

    TrackUpdateInput:
      type: object
      required:
        - updateDate
        - currentCity
        - newStatus
        - comments
        - currentLocation
        - bkTime
      properties:
        updateDate:
          type: string
        currentCity:
          type: string
        newStatus:
          type: string
        comments:
          type: string
        currentLocation:
          type: string
        bkTime:
          type: string
        rName:
          type: string
        rPhone:
          type: string
        rMail:
          type: string
        rAdd:
          type: string

    # ─── Officer ─────────────────────────────────────────────────────────────
    Officer:
      type: object
      required: [id, officerName, address, email, phNo, office, regDate]
      properties:
        id:
          type: integer
        officerName:
          type: string
        address:
          type: string
        email:
          type: string
        phNo:
          type: string
        office:
          type: string
        regDate:
          type: string

    OfficerInput:
      type: object
      required: [officerName, offPwd, address, email, phNo, office]
      properties:
        officerName:
          type: string
        offPwd:
          type: string
        address:
          type: string
        email:
          type: string
        phNo:
          type: string
        office:
          type: string

    # ─── Office ──────────────────────────────────────────────────────────────
    Office:
      type: object
      required: [id, offName, address, city, phNo, officeTime, contactPerson]
      properties:
        id:
          type: integer
        offName:
          type: string
        address:
          type: string
        city:
          type: string
        phNo:
          type: string
        officeTime:
          type: string
        contactPerson:
          type: string

    OfficeInput:
      type: object
      required: [offName, address, city, phNo, officeTime, contactPerson]
      properties:
        offName:
          type: string
        address:
          type: string
        city:
          type: string
        phNo:
          type: string
        officeTime:
          type: string
        contactPerson:
          type: string
